# CI = Continuous Integration
# Har push aur pull request pe GitHub ke server pe ye checks chalte hain.
# Koi bhi step fail → commit pe red ❌, sab pass → green ✅.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Same branch pe naya push aaye to purana chalta hua run cancel
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # CI ke andar ek temporary Postgres container (e2e tests real DB pe chalte hain)
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm_ci_password
          POSTGRES_DB: calling_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d calling_crm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Background jobs (BullMQ) ke liye — smoke test me asli scheduler chalta hai
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://crm:crm_ci_password@localhost:5432/calling_crm
      JWT_SECRET: ci-only-test-secret-not-used-anywhere-else
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node (version .nvmrc se)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (exact versions from package-lock.json)
        run: npm ci

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (API)
        run: npm test

      - name: Apply DB migrations
        run: npm run db:deploy -w @crm/api

      - name: E2E tests (API)
        run: npm run test:e2e -w @crm/api

      - name: Build (API + Web)
        run: npm run build

      # Built API ko asli Redis ke saath chalao: DB + scheduler dono "up" hone chahiye.
      # (Unit/e2e tests me scheduler band rehta hai — ye step uski wiring pakadta hai.)
      - name: Smoke test (built API + real Redis scheduler)
        working-directory: apps/api
        run: |
          node dist/main.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4000/api/health > /dev/null && break; sleep 1; done
          curl -s http://localhost:4000/api/health | tee health.json; echo
          if ! grep -q '"database":"up"' health.json || ! grep -q '"scheduler":"up"' health.json; then
            echo "Smoke test failed — API log:"; cat api.log; exit 1
          fi

  # Production Docker images build + poora prod stack (Nginx HTTPS, Postgres, Redis, API, Web, backup)
  # chala ke end-to-end check — Dockerfiles / compose / nginx config ki galti yahin pakdi jaaye
  docker:
    name: Production stack (Docker) smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate compose file
        run: |
          cp .env.production.example .env.production
          docker compose -f docker-compose.prod.yml --env-file .env.production config --quiet
          rm .env.production

      - name: Build images + run prod stack smoke test
        run: ./ops/smoke/prod-stack-smoke.sh
