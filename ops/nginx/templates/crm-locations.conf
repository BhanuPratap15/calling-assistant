# =====================================================================
# CRM ke common rules — main domain (default.conf.template) aur har client domain
# (tenant.conf.template) dono yahi include karte hain. Host: /etc/nginx/snippets/crm-locations.conf
# Host header API tak jaata hai → API usi se client (organization) pehchaanta hai.
# =====================================================================
client_max_body_size 12m; # import file max 10 MB
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml text/csv;

# Security headers (browser ko) — API ke apne helmet headers neeche hide, duplicate na hon
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host; # client ka domain (white-label) — API + Next.js dono padhte hain
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

location = /api/auth/login {
    limit_req zone=login burst=20 nodelay;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_pass http://crm_api;
}

location = /api/platform/auth/login {
    limit_req zone=login burst=10 nodelay;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_pass http://crm_api;
}

# Domain sync sirf server ki script (127.0.0.1:4000 seedha) — bahar se band
location /api/platform/domain-sync/ {
    return 404;
}

location /api/ {
    limit_req zone=api burst=200 nodelay;
    proxy_read_timeout 120s; # 20k rows import preview
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_pass http://crm_api;
}

location / {
    proxy_pass http://crm_web;
}
